# Netlify build config — Next.js auto-detected by @netlify/plugin-nextjs.
# Plugin handles SSR routes, ISR cache, API routes, middleware automatically.

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  # Workaround for Next.js build crash with @react-pdf and similar large deps.
  NODE_OPTIONS = "--max-old-space-size=8192"
  # Node 22+ requerido: @supabase/supabase-js 2.105 falla en Node 20 con
  # "Node.js 20 detected without native WebSocket support" al crear el cliente,
  # lo que rompia send-task-reminders y sync-google-calendars (100% errores).
  NODE_VERSION = "22"
  # Used by Sentry to detect CI environment (enables source map upload)
  CI = "true"

# Branch-based deploy contexts.
# Production deploys come from `main`; staging from `staging` branch.
[context.production]
  command = "npm run build"

[context.staging]
  command = "npm run build"

[context.deploy-preview]
  command = "npm run build"

# Next.js plugin is auto-installed by Netlify when it detects Next.js.
# No explicit [[plugins]] block needed.
